name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: CLI smoke test
        run: |
          node packages/cli/dist/cli.js wechat examples/demo.md -o out/wechat.html
          node packages/cli/dist/cli.js zhihu examples/demo.md -o out/zhihu.html
          node packages/cli/dist/cli.js thread examples/demo.md --json > out/thread.json
          node packages/cli/dist/cli.js thread examples/demo.md -p linkedin > out/linkedin.txt
      - name: Render images (headless Chromium)
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji
          node packages/cli/dist/cli.js xhs examples/demo.md -o out/xhs -a "@md2"
          node packages/cli/dist/cli.js cover examples/demo.md -s wechat -o out/cover.png
          node packages/cli/dist/cli.js long examples/demo.md -o out/long.png
          node packages/cli/dist/cli.js wechat examples/demo.md -o out/wechat-mermaid.html
      - name: Package VS Code extension
        run: cd apps/vscode && npx vsce package --no-dependencies -o ../../out/md2.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: rendered
          path: out/
